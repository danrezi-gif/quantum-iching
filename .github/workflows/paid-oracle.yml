name: Paid oracle checks
on:
  pull_request:
  push:
    branches:
      - feature/legge-kofi-reading-credits
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
